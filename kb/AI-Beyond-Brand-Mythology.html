  bar.style.cssText = 'max-width:920px;margin:0 auto;padding:24px 32px 0;';
  bar.innerHTML = '<button id="zl-back-btn" onclick="if(window.history.length>1){window.history.back()}else{window.location.href=\'/\';}" style="display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;font-weight:500;color:#121212;border:1px solid #e9e8e4;background:#fff;padding:7px 14px;cursor:pointer;">← Back</button>';
  var root = document.getElementById('root');
  if(root) root.parentNode.insertBefore(bar, root);
  else document.body.insertBefore(bar, document.body.firstChild);
})();
</script>
