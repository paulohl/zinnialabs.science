<!DOCTYPE html>
<html lang="en">
<head>
<style>
    /* Centering the menu on the page */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
    }

    /* Main Menu Wrapper */
    .nav-container {
        background-color: #333;
        padding: 10px 20px;
        border-radius: 5px;
    }

    /* Flexbox for horizontal alignment */
    .menu {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        gap: 20px;
    }

    .menu li {
        position: relative;
    }

    .menu a {
        text-decoration: none;
        color: white;
        padding: 10px 15px;
        display: block;
    }

    .menu a:hover {
        background-color: #555;
        border-radius: 3px;
    }

    /* Dropdown Submenu */
    .submenu {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        background-color: #444;
        list-style: none;
        padding: 0;
        margin: 0;
        min-width: 150px;
        border-radius: 0 0 5px 5px;
    }

    .submenu li a {
        padding: 10px;
    }

    /* Show dropdown on hover */
    .menu li:hover .submenu {
        display: block;
    }
</style>
</head>
<body>

<div class="nav-container">
    <ul class="menu">
        <li><a href="#">Home</a></li>
        <li>
            <a href="#">Products ▼</a>
            <ul class="submenu">
                <li><a href="#">Web Apps</a></li>
                <li><a href="#">Mobile Apps</a></li>
            </ul>
        </li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</div>

</body>
</html>
